name: fastmeals

services:
  db:
    build: docker/postgres
    environment:
      POSTGRES_USER: fastmeals
      POSTGRES_PASSWORD: fastmeals123
      POSTGRES_DB: fastmeals
    # 5433 no host para não colidir com um PostgreSQL local na 5432, e só em
    # 127.0.0.1: o banco fica acessível para desenvolvimento, nunca pela rede.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmeals -d fastmeals"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://fastmeals:fastmeals123@db:5432/fastmeals
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      # Segredos de desenvolvimento, como a senha do banco acima. Em produção vêm de um
      # cofre de segredos, nunca do repositório. Ficam fixos aqui de propósito: interpolar
      # ${JWT_SECRET} puxaria o .env da raiz, e os valores de exemplo dele derrubam a API
      # em produção.
      JWT_SECRET: dev-access-secret-change-me-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-in-production
      # O painel chega pela nginx do frontend; sem confiar nesse salto, todo usuário
      # teria o IP da nginx e dividiria o mesmo limite de requisições.
      TRUST_PROXY_HOPS: 1
    # Só em 127.0.0.1: confiando num proxy, quem falasse direto com a porta 3001 pela
    # rede poderia forjar o X-Forwarded-For. Swagger e testes manuais usam a máquina local.
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health > /dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
